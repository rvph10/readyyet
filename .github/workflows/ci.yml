name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @readyyet/shared run typecheck
      - run: pnpm --filter @readyyet/shared run build

  lint:
    runs-on: ubuntu-latest

    # prisma.config.ts requires DATABASE_URL to be set even for
    # `prisma generate`, which never connects, so no Postgres service here.
    env:
      DATABASE_URL: postgresql://readyyet:readyyet@localhost:5432/readyyet

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-aware rules need the Prisma client and @readyyet/shared's
      # declarations to exist, same as the api job's typecheck does.
      - run: pnpm --filter @readyyet/db run generate
      - run: pnpm --filter @readyyet/shared run build
      - run: pnpm lint
      - run: pnpm format:check

  db:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: readyyet
          POSTGRES_PASSWORD: readyyet
          POSTGRES_DB: readyyet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readyyet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://readyyet:readyyet@localhost:5432/readyyet

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @readyyet/db run generate
      - run: pnpm --filter @readyyet/db exec prisma migrate deploy
      - run: pnpm --filter @readyyet/db run typecheck
      - run: pnpm --filter @readyyet/db run test

  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: readyyet
          POSTGRES_PASSWORD: readyyet
          POSTGRES_DB: readyyet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readyyet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://readyyet:readyyet@localhost:5432/readyyet
      # The email e2e tests send real (test-mode) emails via Resend, see
      # docs/decisions/0010-resend-mail-infrastructure.md. RESEND_API_KEY
      # must be set as a repo secret.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: "ReadyYet <hello@readyyet.app>"
      WEB_URL: http://localhost:3001
      # Checked at startup (api/src/config/env.ts). A fixed value is fine:
      # it only signs sessions of a throwaway CI database.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @readyyet/db run generate
      - run: pnpm --filter @readyyet/db exec prisma migrate deploy
      - run: pnpm --filter @readyyet/db run seed
      - run: pnpm --filter @readyyet/shared run build
      - run: pnpm --filter @readyyet/api run typecheck
      - run: pnpm --filter @readyyet/api run build
      - run: pnpm --filter @readyyet/api run test
