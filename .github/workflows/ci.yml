name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  shared:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @readyyet/shared run typecheck
      - run: pnpm --filter @readyyet/shared run build

  # Known vulnerabilities in any dependency, from the lockfile alone.
  # Ignored advisories are listed in pnpm-workspace.yaml with their reason.
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm audit --audit-level high

  lint:
    runs-on: ubuntu-latest

    # prisma.config.ts requires DATABASE_URL to be set even for
    # `prisma generate`, which never connects, so no Postgres service here.
    env:
      DATABASE_URL: postgresql://readyyet:readyyet@localhost:5432/readyyet

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-aware rules need the Prisma client and @readyyet/shared's
      # declarations to exist, same as the api job's typecheck does.
      - run: pnpm --filter @readyyet/db run generate
      - run: pnpm --filter @readyyet/shared run build
      - run: pnpm lint
      - run: pnpm format:check

  db:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: readyyet
          POSTGRES_PASSWORD: readyyet
          POSTGRES_DB: readyyet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readyyet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://readyyet:readyyet@localhost:5432/readyyet

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @readyyet/db run generate
      - run: pnpm --filter @readyyet/db exec prisma migrate deploy
      - run: pnpm --filter @readyyet/db run typecheck
      - run: pnpm --filter @readyyet/db run test

  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: readyyet
          POSTGRES_PASSWORD: readyyet
          POSTGRES_DB: readyyet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readyyet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Stands in for the Railway Bucket, like docker-compose.yml's.
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: readyyet
        ports:
          - 9090:9090

    env:
      DATABASE_URL: postgresql://readyyet:readyyet@localhost:5432/readyyet
      S3_ENDPOINT: http://localhost:9090
      S3_REGION: us-east-1
      S3_BUCKET: readyyet
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      # The email e2e tests send real (test-mode) emails via Resend, see
      # docs/decisions/0010-resend-mail-infrastructure.md. RESEND_API_KEY
      # must be set as a repo secret.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: "ReadyYet <hello@readyyet.app>"
      WEB_URL: http://localhost:3001
      SUPPORT_EMAIL: support@readyyet.app
      # Checked at startup (api/src/config/env.ts). A fixed value is fine:
      # it only signs sessions of a throwaway CI database.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      # Never called: the billing tests replace the Stripe client
      # (api/src/billing/stripe-client.ts), startup only checks the shape.
      STRIPE_SECRET_KEY: sk_test_ci_only_never_used

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @readyyet/db run generate
      - run: pnpm --filter @readyyet/db exec prisma migrate deploy
      - run: pnpm --filter @readyyet/db run seed
      - run: pnpm --filter @readyyet/shared run build
      - run: pnpm --filter @readyyet/api run typecheck
      - run: pnpm --filter @readyyet/api run build
      # Every API change has to show up in the PR as a diff of this file.
      - name: Check api/openapi.json is up to date
        run: |
          pnpm --filter @readyyet/api run openapi
          git diff --exit-code api/openapi.json || { echo "::error::api/openapi.json is out of date, run: pnpm --filter @readyyet/api run openapi"; exit 1; }
      - run: pnpm --filter @readyyet/api run test

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @readyyet/shared run build
      - run: pnpm --filter @readyyet/web run typecheck
      - run: pnpm --filter @readyyet/web run build

  site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @readyyet/site run typecheck
      - run: pnpm --filter @readyyet/site run build
