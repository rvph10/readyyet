name: Promotion

# Required on main (ADR 0023): only staging is merged into main, and only
# once staging runs exactly that commit and is healthy.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Only staging is merged into main
        if: github.head_ref != 'staging' || github.event.pull_request.head.repo.full_name != github.repository
        # Through env, not interpolated into the script: a fork picks its
        # branch name.
        env:
          HEAD: ${{ github.event.pull_request.head.label }}
        run: |
          echo "::error::Only staging can be merged into main, this PR comes from $HEAD"
          exit 1

      - name: Staging runs this commit and is healthy
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          # The API, the web app and the sales site, each deployed by Railway
          # on every commit, so each must run this one.
          HEALTH_URLS: >-
            https://api.readyyet-staging.app/health
            https://app.readyyet-staging.app/health
            https://readyyet-staging.app/health
        # Railway deploys staging a few minutes after the push, so wait for it,
        # up to 15 minutes. Only a 200 counts, a redirect or another 2xx doesn't.
        run: |
          deadline=$(( $(date +%s) + 900 ))
          for url in $HEALTH_URLS; do
            until
              : > headers.txt
              status=$(curl -sS -m 10 -o /dev/null -D headers.txt -w '%{http_code}' "$url") || status=""
              release=$(tr -d '\r' < headers.txt | awk -F': ' 'tolower($1) == "x-release" { print $2 }')
              [ "$status" = "200" ] && [ "$release" = "$SHA" ]
            do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$url isn't healthy on $SHA after 15 minutes"
                exit 1
              fi
              echo "$url answers ${status:-nothing} running ${release:-an unknown commit}, waiting for $SHA"
              sleep 30
            done
            echo "$url runs $SHA and answers 200"
          done
